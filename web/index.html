<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expand-to</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23ff6b4a%22/%3E%3Cpath d=%22M14 40 L32 22 L50 40 Z%22 fill=%22%23fff%22/%3E%3Crect x=%2222%22 y=%2238%22 width=%2220%22 height=%2212%22 rx=%222%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <meta name="description" content="Expand-to — stratégie, gestion, exploration et diplomatie au tour par tour.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>

    <header id="topbar" hidden>
      <div class="brand">Expand<span>-to</span></div>
      <div id="resources" class="resources"></div>
      <div class="top-actions">
        <div id="turn" class="turn"></div>
        <button class="btn" data-action="tech" title="Technologies (T)">Technologies</button>
        <button class="btn" data-action="diplo" title="Diplomatie (D)">Diplomatie</button>
        <button class="btn" data-action="menu" title="Menu : sauvegardes, export (M)">Menu</button>
        <button class="btn primary" data-action="end-turn" title="Fin du tour (Entrée)">Finir le tour</button>
      </div>
    </header>

    <aside id="side" hidden>
      <section class="card" id="minimap"><canvas aria-label="Mini-carte : cliquez pour centrer la vue"></canvas></section>
      <section class="card" id="scoreboard"></section>
      <section id="proposals"></section>
      <section class="card" id="journal"></section>
    </aside>

    <section id="tutorial" class="card" hidden aria-live="polite"></section>
    <section id="summary" class="card" hidden aria-live="polite"></section>
    <section id="stock" class="card" hidden></section>
    <section id="selection" class="card" hidden></section>
    <nav id="buildbar" class="card" hidden></nav>
    <div id="hint" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" hidden></div>

    <div id="start" class="overlay"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
