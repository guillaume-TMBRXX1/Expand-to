<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expand-to">
  <meta name="theme-color" content="#efe8e4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Expand-to</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23ff6b4a%22/%3E%3Cpath d=%22M14 40 L32 22 L50 40 Z%22 fill=%22%23fff%22/%3E%3Crect x=%2222%22 y=%2238%22 width=%2220%22 height=%2212%22 rx=%222%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <meta name="description" content="Expand-to — stratégie, gestion, exploration et diplomatie au tour par tour.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>

    <header id="topbar" hidden>
      <div class="brand">Expand<span>-to</span></div>
      <div id="resources" class="resources"></div>
      <div class="top-actions">
        <div id="turn" class="turn"></div>
        <button class="btn" data-action="tech" title="Technologies (T)"><span class="lbl-long">Technologies</span><span class="lbl-short">Techno</span></button>
        <button class="btn" data-action="policies" title="Politiques (P)"><span class="lbl-long">Politiques</span><span class="lbl-short">Polit.</span><span class="badge" id="policy-badge" hidden></span></button>
        <button class="btn" data-action="people" title="Grands personnages et ambitions (G)"><span class="lbl-long">Personnages</span><span class="lbl-short">Génies</span><span class="badge" id="people-badge" hidden></span></button>
        <button class="btn" data-action="diplo" title="Diplomatie (D)"><span class="lbl-long">Diplomatie</span><span class="lbl-short">Diplo</span></button>
        <button class="btn side-toggle" data-action="toggle-side" aria-expanded="false" aria-controls="side" title="Classement, mini-carte, propositions et journal">Infos<span class="badge" id="side-badge" hidden></span></button>
        <button class="btn" data-action="menu" title="Menu : sauvegardes, export (M)" aria-label="Menu"><span class="lbl-long">Menu</span><span class="lbl-short" aria-hidden="true">☰</span></button>
        <button class="btn primary" data-action="end-turn" title="Fin du tour (Entrée)"><span class="lbl-long">Finir le tour</span><span class="lbl-short">Fin du tour</span><span class="badge wait-badge" id="wait-badge" hidden></span></button>
      </div>
    </header>

    <aside id="side" hidden>
      <section class="card" id="minimap"><canvas aria-label="Mini-carte : cliquez pour centrer la vue"></canvas></section>
      <section class="card" id="scoreboard"></section>
      <section id="proposals"></section>
      <section class="card" id="journal"></section>
    </aside>

    <section id="tutorial" class="card" hidden aria-live="polite"></section>
    <section id="summary" class="card" hidden aria-live="polite"></section>
    <section id="stock" class="card" hidden></section>
    <section id="selection" class="card" hidden></section>
    <nav id="buildbar" class="card" hidden></nav>
    <div id="hint" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="tiptile" hidden></div>
    <div id="modal" hidden></div>

    <div id="start" class="overlay"></div>
    <div id="rotate" class="overlay" hidden><div class="card start" style="text-align:center;max-width:420px"><h2>Tournez votre iPad</h2><p class="lead" style="margin:10px auto 18px">Expand-to se joue à l'horizontale : la carte et les panneaux y ont toute la place.</p><button class="btn" data-action="dismiss-rotate">Continuer quand même</button></div></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
