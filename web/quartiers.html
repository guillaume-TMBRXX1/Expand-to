<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quartiers conseillés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #efe8e4; font-family: "Nunito", system-ui, sans-serif; color: #2f2a33; overflow: hidden; }
    #view { position: fixed; left: 0; top: 70px; bottom: 0; width: 60%; }
    #legend { position: fixed; right: 22px; top: 92px; width: calc(40% - 44px); }
    #legend .row { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; background: #fffdfb; border-radius: 12px; padding: 7px 10px; margin-bottom: 7px; box-shadow: 0 1px 3px rgba(60,40,30,.1); }
    #legend .num { width: 22px; height: 22px; border-radius: 50%; background: #2f2a33; color: #fff; font-weight: 800; font-size: 12px; display: grid; place-items: center; }
    #legend .num.city { background: #ff6b4a; }
    #legend b { font-size: 14px; } #legend .bonus { font-weight: 800; font-size: 13px; margin-left: 4px; }
    #legend .why { color: #6e6267; font-size: 12px; margin-top: 1px; }
    .marker { position: absolute; transform: translate(-50%, -100%); width: 24px; height: 24px; border-radius: 50%; background: #2f2a33; color: #fff; font-weight: 800; font-size: 12.5px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fffdfb, 0 2px 4px rgba(0,0,0,.2); pointer-events: none; }
    .marker.city { background: #ff6b4a; }
    header { position: fixed; top: 14px; left: 18px; right: 18px; }
    h1 { margin: 0; font-size: 22px; font-weight: 800; } h1 span { color: #ff6b4a; }
    #sub { margin: 2px 0 0; color: #6e6267; font-size: 13.5px; max-width: 760px; }
    #total { position: fixed; bottom: 14px; right: 22px; font-size: 13.5px; font-weight: 700; background: #fffdfb; border-radius: 12px; padding: 6px 12px; box-shadow: 0 1px 3px rgba(60,40,30,.12); }
    .label { position: absolute; transform: translate(-50%, -100%); text-align: center; pointer-events: none; white-space: nowrap; }
    .label b { display: block; font-size: 11.5px; font-weight: 800; background: #2f2a33; color: #fff; border-radius: 999px; padding: 1px 8px; }
    .label i { display: inline-block; margin-top: 2px; font-style: normal; font-size: 11px; font-weight: 800; background: #fffdfb; border-radius: 999px; padding: 0 7px; box-shadow: 0 1px 3px rgba(60,40,30,.15); }
    .label i.none { color: #8a7f84; font-weight: 600; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: 1px; }
    #nav { position: fixed; left: 18px; bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
    #nav a { font-size: 12.5px; background: #fffdfb; border-radius: 999px; padding: 3px 10px; color: inherit; text-decoration: none; box-shadow: 0 1px 3px rgba(60,40,30,.12); }
    body.capture #nav { display: none; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
  <div id="view"></div>
  <header><h1 id="title">Quartiers conseillés</h1><p id="sub"></p></header>
  <div id="legend"></div>
  <div id="total"></div>
  <nav id="nav"></nav>
  <script type="module" src="src/quarters.js"></script>
</body>
</html>
